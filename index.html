<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Brusque</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow: hidden;
        }

        /* TELAS */

        .screen {
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-size: cover;
            background-position: center;
        }

        .active {
            display: flex;
        }

        /* ---------- TELA INICIAL ---------- */

        #home {
            background-image: url("./img/Frame\ 6.png");
            background-size: contain;

        }

        #nome,
        #escola,
        #idade {
            background: transparent;
            border: 4px solid #ad7f00;
            color: bla;
            font-weight: bold;
        }

        .card {
            width: 400px;
            background: rgb(251, 239, 193);
            border-radius: 40px;
            padding: 40px;
            margin-top: 120px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border: 6px solid #ad7f00;
            
        }


        input {
            padding: 18px;
            border-radius: 20px;
            border: none;
            outline: none;
            font-size: 20px;
            background: #f2f2f2;
        }

        button {
            padding: 20px;
            border: none;
            border-radius: 20px;
            font-size: 28px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .startBtn {
            background: #1f7a13;
            color: white;
        }

        .startBtn:hover {
            transform: scale(1.05);
        }

        /* ---------- QUIZ ---------- */

        #quiz {
            background-image: url("./img/Frame\ 7.png");
            background-size: contain;

        }

        .quizBox {
            width: 1100px;
            text-align: center;
        }


        .answers {
            display: flex;
            justify-content: center;
            gap: 40px;
            background-size: contain;
        }

        .answer {
            cursor: pointer;
            transition: 0.5s;
            background-size: contain;
        }

        .answer:hover {
            transform: scale(1.05);
        }

        .answer img {
            width: 280px;
            height: 280px;
            object-fit: contain;
            border-radius: 25px;
            border: 8px  solid #ad7f00;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            background-color: white;
        }

        /* ---------- BOTÃO DE VOLTAR ---------- */

        #inicio {
            position: fixed;
            bottom: 840px;
            left: 30px;
            display: none;
        }

        #inicio button {
            background: #ad7702;
            color: white;
            border: 2px solid rgb(0, 0, 0);
            padding: 25px 50px;
            border-radius: 20px;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: black;
            
        }

        #inicio button:hover {
            transform: scale(1.05);
            background: #14540d;
        }

        /* ---------- FINAL ---------- */

        #final {
            background-image: url("./img/fim.png");
            background-size: contain;
        }

        .finalBox {
            background: rgb(251, 239, 193);
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            border: 6px solid #ad7f00;;
        }

        .finalBox h1 {
            font-size: 60px;
            margin-bottom: 20px;
            color: #1f7a13;
        }

        .feedback {
            font-size: 35px;
            margin-bottom: 30px;
        }

        .score {
            font-size: 45px;
            color: #003b8f;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

    <!-- TELA INICIAL -->

    <div id="home" class="screen active">

        <div class="card">



            <input type="text" id="nome" placeholder="NOME">
            <input type="text" id="escola" placeholder="ESCOLA">
            <input type="number" id="idade" placeholder="IDADE">

            <button class="startBtn" onclick="startGame()">
                COMEÇAR!
            </button>

        </div>

    </div>

    <!-- TELA DE PERGUNTA -->

    <div id="quiz" class="screen">

        <div class="quizBox">

            <div class="question" id="question">
                Qual imagem representa Brusque?
            </div>

            <div class="answers" id="answers"></div>

        </div>

    </div>

    <div id="inicio">
        <button onclick="location.reload()">
            VOLTAR AO INÍCIO
        </button>

    </div>

    <!-- TELA FINAL -->

    <div id="final" class="screen">

        <div class="finalBox">


            <div class="feedback" id="feedback"></div>

            <div class="score" id="score"></div>

            <button class="startBtn" onclick="restartGame()">
                JOGAR NOVAMENTE
            </button>

        </div>

    </div>

    <script>

        const questions = [

            {
                question: "",
                answers: [

                    {
                        image: "./img/brusqueiro.png",
                        correct: false
                    },

                    {
                        image: "./img/brusquense.png",
                        correct: true
                    },

                    {
                        image: "./img/bruscano.png",
                        correct: false
                    }

                ]
            }



        ];

        let currentQuestion = 0;
        let score = 0;

        function startGame() {

            document.getElementById("home").classList.remove("active");
            document.getElementById("quiz").classList.add("active");

            document.getElementById("inicio").style.display = "block";

            loadQuestion();
        }

        function loadQuestion() {

            const q = questions[currentQuestion];

            document.getElementById("question").innerText = q.question;

            const answersDiv = document.getElementById("answers");

            answersDiv.innerHTML = "";

            q.answers.forEach(answer => {

                const div = document.createElement("div");

                div.classList.add("answer");

                div.innerHTML = `
            <img src="${answer.image}">
        `;

                div.onclick = () => checkAnswer(answer.correct);

                answersDiv.appendChild(div);

            });

        }

        function checkAnswer(correct) {

            if (correct) {
                score++;
            }

            currentQuestion++;

            if (currentQuestion < questions.length) {

                loadQuestion();

            } else {

                showFinal();

            }

        }

        function showFinal() {

            document.getElementById("quiz").classList.remove("active");
            document.getElementById("final").classList.add("active");

            document.getElementById("score").innerText =
                `PONTUAÇÃO: ${score}/${questions.length}`;

            let feedback = "";

            if (score === questions.length) {

                feedback = "MUITO BEM!";

            } else if (score > 0) {

                feedback = "MUITO BEM!";

            } else {

                feedback = "QUASE LÁ, TENTE DE NOVO!";

            }

            document.getElementById("feedback").innerText = feedback;

        }

        function restartGame() {

            currentQuestion = 0;
            score = 0;

            document.getElementById("final").classList.remove("active");
            document.getElementById("home").classList.add("active");

            document.getElementById("inicio").style.display = "none";


        }

    </script>

</body>

</html>
